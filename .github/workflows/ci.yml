name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA-AI-Blueprints/aiq
          # Last verified AI-Q namespace; newer upstream uses deep_researcher_agent.
          ref: bf4e67d1564ef8d2ec8f65b5f9001e512befc095
          path: .aiq-source
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m ruff check --select S src
      - run: python -m pytest -q
        env:
          AIQ_SOURCE_DIR: ${{ github.workspace }}/.aiq-source/src

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: aiq-sandbox-sprites-dist
          path: dist/
          if-no-files-found: error
