[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "aiq-sandbox-sprites"
version = "0.1.0"
description = "Fly.io Sprites sandbox provider for NVIDIA AI-Q"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sprites Team" }]
requires-python = ">=3.11,<3.14"
keywords = ["agents", "ai-q", "deepagents", "sandbox", "sprites"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.6.8,<0.8",
    "sprites-py>=0.5,<1",
]

[project.entry-points."aiq.sandbox_providers"]
sprites = "aiq_sprites.provider:SpritesSandboxProvider"

[project.urls]
Homepage = "https://sprites.dev"
Documentation = "https://docs.sprites.dev"
Issues = "https://github.com/superfly/aiq-sandbox-sprites/issues"
Repository = "https://github.com/superfly/aiq-sandbox-sprites"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<1.28",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.15,<0.16",
    "twine>=6,<7",
]

[tool.hatch.build.targets.sdist]
include = [
    "examples",
    "scripts",
    "src/aiq_sprites",
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiq_sprites"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["live: creates and destroys a real Sprite"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
